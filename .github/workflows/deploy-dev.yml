name: Deploy Develop

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::740667376891:role/GitHubActions-Deploy-Dev
          aws-region: ap-southeast-2

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "i-001d7afb31ea4d6df" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd ~/SKN34-3rd-5Team && git pull origin develop && docker compose up -d --build"]'